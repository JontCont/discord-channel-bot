name: Deploy Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      project:
        required: true
        type: string
    secrets:
      DEPLOY_WEBHOOK_URL:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
  DEPLOY_PROJECT: ${{ inputs.project }}
  IMAGE_SUFFIX: ${{ inputs.image }}

jobs:
  deploy:
    name: Deploy ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Production Deployment Webhook
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          response=$(curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${DEPLOY_PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          printf '%s\n' "$response"
          if ! jq -e -s \
            --arg project "$DEPLOY_PROJECT" \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}:latest" \
            'length == 1 and (.[0] | type == "object" and .status == "success" and .project == $project and .image == $image)' \
            <<< "$response" > /dev/null; then
            echo "::error::Deployment webhook did not confirm success for the expected project and image."
            exit 1
          fi
