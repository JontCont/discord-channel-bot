name: Deploy Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      project:
        required: true
        type: string
    secrets:
      DEPLOY_WEBHOOK_URL:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
  DEPLOY_PROJECT: ${{ inputs.project }}
  IMAGE_SUFFIX: ${{ inputs.image }}

jobs:
  deploy:
    name: Deploy ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Production Deployment Webhook
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${DEPLOY_PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload"
          echo "Deployment webhook triggered successfully for ${DEPLOY_PROJECT}."
