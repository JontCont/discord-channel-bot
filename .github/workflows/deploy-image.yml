name: Deploy Image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      project:
        required: true
        type: string
    secrets:
      DEPLOY_WEBHOOK_URL:
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
  DEPLOY_PROJECT: ${{ inputs.project }}
  IMAGE_SUFFIX: ${{ inputs.image }}

jobs:
  deploy:
    name: Deploy ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Production Deployment Webhook
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          # Fire-and-forget: n8n may keep the request open while the NAS restarts.
          # A read timeout after the connection was established still counts as
          # delivered; failures are reported by n8n to Discord.
          set +e
          result=$(curl --fail --show-error --silent --output /dev/null \
            --write-out '%{http_code} %{time_connect}' \
            --connect-timeout 10 --max-time 15 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${DEPLOY_PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          rc=$?
          set -e
          connect_time=${result##* }
          if [[ $rc -eq 0 ]]; then
            echo "Deployment webhook triggered successfully."
          elif [[ $rc -eq 28 && "$connect_time" != "0.000000" ]]; then
            echo "Deployment webhook accepted; n8n is still processing (no wait)."
          else
            echo "::error::Deployment webhook request failed (curl exit $rc)."
            exit 1
          fi
