name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
  BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bot: ${{ steps.targets.outputs.bot }}
      web: ${{ steps.targets.outputs.web }}
      image_tags: ${{ steps.targets.outputs.image_tags }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Change Record Validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Change Record Validation
        run: python -m unittest discover -s .github/scripts -p test_changes.py

      - name: Validate Commit Change Records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF" == refs/tags/* ]]; then
            python .github/scripts/changes.py latest > /dev/null
          else
            python .github/scripts/changes.py check --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Filter Changed Paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bot:
              - 'apps/bot/**'
              - '.github/workflows/cicd.yml'
              - '.github/workflows/build-image.yml'
              - '.github/workflows/deploy-image.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'tsconfig.base.json'
              - 'apps/web/Dockerfile.dockerignore'
              - '.github/workflows/cicd.yml'
              - '.github/workflows/build-image.yml'
              - '.github/workflows/deploy-image.yml'

      - name: Select Build Targets
        id: targets
        env:
          BOT_CHANGED: ${{ steps.filter.outputs.bot }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
        run: |
          if [[ "$BUILD_ALL" == "true" ]]; then
            BOT_CHANGED=true
            WEB_CHANGED=true
          fi
          images=()
          if [[ "${BOT_CHANGED:-false}" == "true" ]]; then
            images+=("${REGISTRY}/${IMAGE_NAME,,}-bot")
          fi
          if [[ "${WEB_CHANGED:-false}" == "true" ]]; then
            images+=("${REGISTRY}/${IMAGE_NAME,,}-web")
          fi
          echo "bot=${BOT_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          echo "image_tags=${images[*]}" >> "$GITHUB_OUTPUT"

  build-api:
    name: API Build
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: bot
      context: apps/bot
      dockerfile: apps/bot/Dockerfile

  deploy-api:
    name: API Deploy
    needs: build-api
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-image.yml
    with:
      image: bot
      project: discord-channel-bot
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

  build-web:
    name: Web Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: web
      context: .
      dockerfile: apps/web/Dockerfile

  deploy-web:
    name: Web Deploy
    needs: build-web
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-image.yml
    with:
      image: web
      project: discord-channel-bot-web
    secrets:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}

  # ── 3. Notify: Discord Webhook 通知 ──────────────────────
  notify:
    name: 📢 Discord Webhook Notification
    needs: [changes, build-api, deploy-api, build-web, deploy-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Change Records
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read Latest Changes
        id: latest_changes
        run: |
          latest=$(python .github/scripts/changes.py latest)
          delimiter=$(openssl rand -hex 16)
          {
            echo "content<<$delimiter"
            printf '%s\n' "$latest"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: 📤 Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          API_BUILD_STATUS: ${{ needs.build-api.result }}
          API_DEPLOY_STATUS: ${{ needs.deploy-api.result }}
          WEB_BUILD_STATUS: ${{ needs.build-web.result }}
          WEB_DEPLOY_STATUS: ${{ needs.deploy-web.result }}
          IMAGE_TAGS: ${{ needs.changes.outputs.image_tags }}
          LATEST_CHANGES: ${{ steps.latest_changes.outputs.content }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          if not webhook_url:
              print("⚠️ No Discord webhook URL configured, skipping notification.")
              exit(0)

          changes_status = os.environ.get("CHANGES_STATUS")
          build_statuses = {"bot": os.environ["API_BUILD_STATUS"], "web": os.environ["WEB_BUILD_STATUS"]}
          deploy_statuses = (os.environ["API_DEPLOY_STATUS"], os.environ["WEB_DEPLOY_STATUS"])
          image_tags_raw = os.environ.get("IMAGE_TAGS", "")
          changes_text = os.environ["LATEST_CHANGES"].strip()
          if not changes_text:
              raise ValueError("The latest CHANGELOG.md entry is empty.")
          author = os.environ.get("AUTHOR", "")
          repo = os.environ.get("REPO", "")
          ref = os.environ.get("REF", "")
          server_url = os.environ.get("SERVER_URL", "https://github.com")
          run_id = os.environ.get("RUN_ID", "")
          event_name = os.environ.get("EVENT_NAME", "")

          repo_url = f"{server_url}/{repo}"
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}"

          branch_statuses = (*build_statuses.values(), *deploy_statuses)
          branches_succeeded = (
              all(status in ("success", "skipped") for status in branch_statuses)
              and "success" in build_statuses.values()
          )
          if changes_status == "success" and branches_succeeded:
              color = 5763719  # Green
              title = "🚀 CI/CD Pipeline 執行成功！"
              if event_name == "pull_request":
                  desc = "受影響的應用程式已通過 Docker 建置驗證（未推送 Docker Image）。"
              else:
                  desc = "受影響的 Docker Image 已成功構建並推送至 GitHub Container Registry (GHCR)，部署 webhook（若適用）已確認成功。"
          elif changes_status == "success" and all(status == "skipped" for status in branch_statuses):
              color = 3447003  # Blue
              title = "ℹ️ 無需建置 Docker Image"
              desc = "本次變更未影響 API（Bot）或 Web，已略過 Python 語法檢查、Docker 建置與部署。"
          else:
              color = 15548997  # Red
              title = "❌ CI/CD Pipeline 執行失敗"
              desc = "Pipeline 執行過程中發生錯誤，請點擊下方記錄查看詳細日誌以進行除錯。"

          # Discord embed field 不支援標題語法（#），改為粗體 / 標記，保留 - 清單
          formatted_lines = []
          for line in changes_text.splitlines():
              if line.startswith("### "):
                  line = f"【{line[4:].strip()}】"
              elif line.startswith("## "):
                  line = f"**{line[3:].strip()}**"
              if not line.strip() and (not formatted_lines or not formatted_lines[-1].strip()):
                  continue
              formatted_lines.append(line)
          changes_text = "\n".join(formatted_lines).strip()

          if len(changes_text) > 1020:
              changes_text = changes_text[:1015] + "..."

          # 解析 Docker Images
          successful_images = [
              image for image in image_tags_raw.split()
              if build_statuses[image.rsplit("-", 1)[-1]] == "success"
          ]
          if successful_images and event_name != "pull_request":
              image_lines = "\n".join(f"`{image}`" for image in successful_images)
          else:
              image_lines = "無（未推送或執行失敗）"

          payload = {
              "username": "GitHub Actions CI/CD",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [
                  {
                      "title": title,
                      "description": desc,
                      "color": color,
                      "fields": [
                          {"name": "📦 儲存庫", "value": f"[{repo}]({repo_url})", "inline": True},
                          {"name": "🌿 分支 / 標籤", "value": f"`{ref}`", "inline": True},
                          {"name": "👤 觸發者", "value": author, "inline": True},
                          {"name": "📝 最新更新紀錄", "value": changes_text, "inline": False},
                          {"name": "🐳 Docker Images (GHCR)", "value": image_lines, "inline": False},
                          {"name": "🔗 執行記錄", "value": f"[查看完整 Actions Run 日誌]({run_url})", "inline": False},
                      ],
                      "footer": {
                          "text": "Discord Channel Bot CI/CD Pipeline",
                          "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      },
                      "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  }
              ],
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-CI-CD"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"✅ Discord notification sent successfully (status: {resp.status})")
          except Exception as e:
              print(f"⚠️ Failed to send Discord notification: {e}")
          EOF
