name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
  BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bot: ${{ steps.matrix.outputs.bot }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_tags: ${{ steps.matrix.outputs.image_tags }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Change Record Validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Change Record Validation
        run: python -m unittest discover -s .github/scripts -p test_changes.py

      - name: Validate Commit Change Records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF" == refs/tags/* ]]; then
            python .github/scripts/changes.py latest > /dev/null
          else
            python .github/scripts/changes.py check --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Filter Changed Paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bot:
              - 'apps/bot/**'
              - '.github/workflows/cicd.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'nx.json'
              - 'tsconfig.base.json'
              - '.dockerignore'
              - '.github/workflows/cicd.yml'

      - name: Select Build Matrix
        id: matrix
        env:
          BOT_CHANGED: ${{ steps.filter.outputs.bot }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
        run: |
          if [[ "$BUILD_ALL" == "true" ]]; then
            BOT_CHANGED=true
            WEB_CHANGED=true
          fi
          matrix=$(jq -cn \
            --argjson bot "${BOT_CHANGED:-false}" \
            --argjson web "${WEB_CHANGED:-false}" \
            '[
              if $bot then {image: "bot", project: "discord-channel-bot", context: "apps/bot", dockerfile: "apps/bot/Dockerfile"} else empty end,
              if $web then {image: "web", project: "discord-channel-bot-web", context: ".", dockerfile: "apps/web/Dockerfile"} else empty end
            ]')
          image_tags=$(jq -r \
            --arg prefix "${REGISTRY}/${IMAGE_NAME,,}" \
            'map("\($prefix)-\(.image)") | join(" ")' <<< "$matrix")
          echo "bot=${BOT_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image_tags=$image_tags" >> "$GITHUB_OUTPUT"

  # ── 1. CI: 語法檢查與依賴驗證 ───────────────────────────
  ci:
    name: 🧪 CI Code Quality & Syntax Check
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/bot/requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r apps/bot/requirements.txt

      - name: 🔍 Compile & Check Python Syntax
        working-directory: apps/bot
        run: |
          python -m py_compile bot.py config.py
          python -m py_compile cogs/prefix/*.py
          python -m py_compile cogs/slash/*.py
          python -m py_compile cogs/repository/*.py
          python -m py_compile cogs/service/*.py
          echo "✅ All Python files passed compilation checks!"

  # ── 2. CD: 構建並推送 Docker Image ──────────────────────
  build-and-push:
    name: 🐳 CD Build & Push Docker Image
    env:
      DEPLOY_PROJECT: ${{ matrix.project }}
      IMAGE_SUFFIX: ${{ matrix.image }}
    needs: [changes, ci]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.matrix != '[]' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=ref,event=branch

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Production Deployment Webhook
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [[ -z "$DEPLOY_WEBHOOK_URL" ]]; then
            echo "::error::Required Actions secret DEPLOY_WEBHOOK_URL is not configured."
            exit 1
          fi
          payload=$(jq -n \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}" \
            --arg tag "latest" \
            '{image: $image, tag: $tag}')
          response=$(curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            "${DEPLOY_WEBHOOK_URL%/}/${DEPLOY_PROJECT}" \
            --header "Content-Type: application/json" \
            --data "$payload")
          printf '%s\n' "$response"
          if ! jq -e -s \
            --arg project "$DEPLOY_PROJECT" \
            --arg image "${REGISTRY}/${IMAGE_NAME,,}-${IMAGE_SUFFIX}:latest" \
            'length == 1 and (.[0] | type == "object" and .status == "success" and .project == $project and .image == $image)' \
            <<< "$response" > /dev/null; then
            echo "::error::Deployment webhook did not confirm success for the expected project and image."
            exit 1
          fi

  # ── 3. Notify: Discord Webhook 通知 ──────────────────────
  notify:
    name: 📢 Discord Webhook Notification
    needs: [changes, ci, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Change Records
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read Latest Changes
        id: latest_changes
        run: |
          latest=$(python .github/scripts/changes.py latest)
          delimiter=$(openssl rand -hex 16)
          {
            echo "content<<$delimiter"
            printf '%s\n' "$latest"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: 📤 Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
          CHANGES_STATUS: ${{ needs.changes.result }}
          CI_STATUS: ${{ needs.ci.result }}
          CD_STATUS: ${{ needs.build-and-push.result }}
          IMAGE_TAGS: ${{ needs.changes.outputs.image_tags }}
          LATEST_CHANGES: ${{ steps.latest_changes.outputs.content }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          if not webhook_url:
              print("⚠️ No Discord webhook URL configured, skipping notification.")
              exit(0)

          changes_status = os.environ.get("CHANGES_STATUS")
          ci_status = os.environ.get("CI_STATUS")
          cd_status = os.environ.get("CD_STATUS")
          image_tags_raw = os.environ.get("IMAGE_TAGS", "")
          changes_text = os.environ["LATEST_CHANGES"].strip()
          if not changes_text:
              raise ValueError("The latest changes.md entry is empty.")
          author = os.environ.get("AUTHOR", "")
          repo = os.environ.get("REPO", "")
          ref = os.environ.get("REF", "")
          sha = os.environ.get("SHA", "")
          server_url = os.environ.get("SERVER_URL", "https://github.com")
          run_id = os.environ.get("RUN_ID", "")
          event_name = os.environ.get("EVENT_NAME", "")

          repo_url = f"{server_url}/{repo}"
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}"

          if changes_status == "success" and ci_status in ("success", "skipped") and cd_status == "success":
              color = 5763719  # Green
              title = "🚀 CI/CD Pipeline 執行成功！"
              if event_name == "pull_request":
                  desc = "受影響的應用程式已通過 Docker 建置驗證（未推送 Docker Image）。"
              else:
                  desc = "受影響的 Docker Image 已成功構建並推送至 GitHub Container Registry (GHCR)，部署 webhook（若適用）已確認成功。"
          elif changes_status == "success" and ci_status == "skipped" and cd_status == "skipped":
              color = 3447003  # Blue
              title = "ℹ️ 無需建置 Docker Image"
              desc = "本次變更未影響 Bot 或 Web，已略過 Bot 語法檢查、Docker 建置與部署。"
          else:
              color = 15548997  # Red
              title = "❌ CI/CD Pipeline 執行失敗"
              desc = "Pipeline 執行過程中發生錯誤，請點擊下方記錄查看詳細日誌以進行除錯。"

          if len(changes_text) > 1020:
              changes_text = changes_text[:1015] + "..."

          # 解析 Docker Images
          if image_tags_raw and cd_status == "success" and event_name != "pull_request":
              image_lines = "\n".join(f"`{t.strip()}`" for t in image_tags_raw.split() if t.strip())
          else:
              image_lines = "無（未推送或執行失敗）"

          payload = {
              "username": "GitHub Actions CI/CD",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [
                  {
                      "title": title,
                      "description": desc,
                      "color": color,
                      "fields": [
                          {"name": "📦 儲存庫", "value": f"[{repo}]({repo_url})", "inline": True},
                          {"name": "🌿 分支 / 標籤", "value": f"`{ref}`", "inline": True},
                          {"name": "👤 觸發者", "value": author, "inline": True},
                          {"name": "📝 最新更新紀錄", "value": changes_text, "inline": False},
                          {"name": "🐳 Docker Images (GHCR)", "value": image_lines, "inline": False},
                          {"name": "🔗 執行記錄", "value": f"[查看完整 Actions Run 日誌]({run_url})", "inline": False},
                      ],
                      "footer": {
                          "text": "Discord Channel Bot CI/CD Pipeline",
                          "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      },
                      "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  }
              ],
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Actions-CI-CD"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"✅ Discord notification sent successfully (status: {resp.status})")
          except Exception as e:
              print(f"⚠️ Failed to send Discord notification: {e}")
          EOF
