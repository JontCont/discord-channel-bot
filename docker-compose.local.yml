services:
  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    image: discord-channel-bot:local
    container_name: discord-channel-bot
    env_file: ${COMPOSE_SERVICE_ENV_FILE:-.env}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: discord-channel-web:local
    depends_on:
      - bot
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"